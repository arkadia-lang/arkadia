name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release with the archives of
# `just dist` and the section of CHANGELOG.md for that version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Check
        run: nix develop --command just check
      - name: Test
        run: nix develop --command just test
      - name: Check that the tag matches the version of ark
        run: |
          version=$(bin/ark version | cut -d' ' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match ark $version (compiler/src/Main.ark)"
            exit 1
          fi
      - name: Build the archives
        run: nix develop --command just dist
      - name: Extract the release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## \[/ { on = index($0, "## [" v "]") == 1; next }
            /^\[[^]]*\]: / { on = 0 }
            on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Arkadia $GITHUB_REF_NAME" --notes-file notes.md dist/*
