name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false
      - name: Check (gofmt, go vet, ark fmt)
        run: make check
      - name: Test (compiler, golden programs, examples, Arkadia unit tests)
        run: go test ./...
      - name: Build the ark command
        run: go build -o ark ./cmd/ark && ./ark version
