name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # the tools come from the flake's devShell, as in development
      - uses: cachix/install-nix-action@v31
      - name: Check (gofmt, go vet, ark fmt)
        run: nix develop --command just check
      - name: Test (compiler, golden programs, examples, Arkadia unit tests, self-hosted compiler)
        run: nix develop --command just test
      - name: Build the ark command
        run: nix develop --command just build && bin/ark version
