name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet
        run: go vet ./...
      - name: Test (compiler, golden programs, examples, Arkadia unit tests)
        run: go test ./...
      - name: Build the ark command
        run: go build -o ark ./cmd/ark && ./ark version
